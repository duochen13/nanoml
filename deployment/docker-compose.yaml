version: '3.8'

services:
  # Service 1: Storage (LocalStack S3)
  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
    volumes:
      - ./volumes/localstack:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nanoml

  # Service 2: Message Queue (Kafka + Zookeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./volumes/zookeeper/data:/var/lib/zookeeper/data
      - ./volumes/zookeeper/log:/var/lib/zookeeper/log
    networks:
      - nanoml

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ./volumes/kafka:/var/lib/kafka/data
    networks:
      - nanoml

  # Service 3: Stream Processing (Flink)
  flink-jobmanager:
    image: flink:1.18
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
    volumes:
      - ./volumes/flink/jobs:/opt/flink/jobs
    networks:
      - nanoml

  flink-taskmanager:
    image: flink:1.18
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
    networks:
      - nanoml

  # Service 4: Feature Store (Feast - Postgres offline + Redis online)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: feast
      POSTGRES_USER: feast
      POSTGRES_PASSWORD: feast
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    networks:
      - nanoml

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    networks:
      - nanoml

  # Service 6: Experiment Tracking (MLflow)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.0
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - ./volumes/mlflow:/mlflow
    networks:
      - nanoml

  # Service 7: Model Serving
  model-server:
    build:
      context: ../infrastructure/model_server
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MODEL_PATH=/models
    volumes:
      - ./volumes/models:/models
    networks:
      - nanoml

  # Service 8: API Gateway
  api:
    build:
      context: ../infrastructure/api_gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - model-server
      - redis
      - mlflow
    environment:
      - MODEL_SERVER_URL=http://model-server:8001
      - FEAST_ONLINE_STORE=redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    networks:
      - nanoml

  # Service 9: Orchestration (Airflow)
  airflow-webserver:
    image: apache/airflow:2.8.0-python3.10
    command: webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_UID=50000
    volumes:
      - ./volumes/airflow/dags:/opt/airflow/dags
      - ./volumes/airflow/logs:/opt/airflow/logs
      - ./volumes/airflow/plugins:/opt/airflow/plugins
    depends_on:
      - postgres
    networks:
      - nanoml

  airflow-scheduler:
    image: apache/airflow:2.8.0-python3.10
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW_UID=50000
    volumes:
      - ./volumes/airflow/dags:/opt/airflow/dags
      - ./volumes/airflow/logs:/opt/airflow/logs
      - ./volumes/airflow/plugins:/opt/airflow/plugins
    depends_on:
      - postgres
    networks:
      - nanoml

  # Service 10: Lineage Tracking (SHALLOW)
  lineage-api:
    build:
      context: ../infrastructure/lineage
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./volumes/lineage:/data
    networks:
      - nanoml

  # Service 11: Frontend Dashboard (SHALLOW)
  dashboard:
    build:
      context: ../infrastructure/dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - lineage-api
      - mlflow
      - airflow-webserver
    environment:
      - REACT_APP_LINEAGE_API=http://lineage-api:9000
      - REACT_APP_MLFLOW_URL=http://mlflow:5000
      - REACT_APP_AIRFLOW_URL=http://airflow-webserver:8080
    networks:
      - nanoml

networks:
  nanoml:
    driver: bridge

volumes:
  localstack:
  zookeeper_data:
  zookeeper_log:
  kafka:
  flink_jobs:
  postgres:
  redis:
  mlflow:
